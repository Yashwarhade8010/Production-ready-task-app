services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cloudops

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    networks:
      - backend-network

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -uroot
        - -p$${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    mem_limit: 512m
    cpus: 1.0

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    mem_limit: 256m
    cpus: 0.5

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      DB_NAME: cloudops
      LOG_LEVEL: info

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - backend-network

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - frontend-network
      - backend-network

    mem_limit: 128m
    cpus: 0.5

volumes:
  mysql_data:

networks:
  frontend-network:
  backend-network:
    internal: true